# 서비스 이름
spring.application.name=mote

spring.servlet.multipart.max-file-size=50000MB
spring.servlet.multipart.max-request-size=50000MB

# MySQL 설정
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3305/mote?serverTimezone=Asia/Seoul
spring.datasource.username=root
spring.datasource.password=root

# JPA 설정
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

